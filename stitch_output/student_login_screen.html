<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vedura - Student Login</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1e3b8a",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121620",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light text-slate-900 font-display antialiased selection:bg-primary/20 selection:text-primary">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto shadow-2xl bg-white">
<!-- Header / Logo Section -->
<div class="flex flex-col items-center justify-center pt-16 pb-6 px-6">
<div class="w-20 h-20 bg-primary/10 rounded-2xl flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-[40px] text-primary">school</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 text-center">Vedura</h1>
<p class="text-slate-500 text-sm font-medium mt-1 text-center">Face Recognition Attendance</p>
</div>
<!-- Illustration/Hero Image -->
<div class="px-6 py-2">
<div class="w-full h-48 rounded-2xl bg-slate-100 overflow-hidden relative group">
<div class="absolute inset-0 bg-gradient-to-t from-primary/20 to-transparent z-10"></div>
<div class="w-full h-full bg-cover bg-center" data-alt="University students studying together on campus" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDAmMV-Xcmb97rxzqnXDHY8oOMshIZhl5Y1QxrJfu5x4NS_hxggDxVwwA8j2z1-6X-Rc7yADWEBrMw_W2xBKK20w4j0cHN3-N3J3KQ8CIR-T3famtci1GJSTUFRj763wI7Q9C5df1_i1NAIzslfWbkPaVzV3NBLkhfLY7qsJULwGY2tPgKH7QJqeGV0YkFmNf8DWk823ZFVzHPf6-0TDRX62GTw9HoEdwpPhgUjwTxl05MC_yVnP9_ufD65exKj1QlKDzVonqa4F-Q');"></div>
</div>
</div>
<!-- Main Content -->
<div class="flex-1 flex flex-col px-6 pt-6">
<h2 class="text-2xl font-bold text-slate-900 mb-2">Welcome Back</h2>
<p class="text-slate-500 mb-8 text-sm">Please sign in to access your dashboard.</p>
<!-- Login Form -->
<form class="flex flex-col gap-5">
<div class="space-y-1">
<label class="text-sm font-semibold text-slate-700 ml-1">Student ID</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400 material-symbols-outlined text-[20px]">badge</span>
<input class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200" placeholder="Enter your ID" type="text"/>
</div>
</div>
<div class="space-y-1">
<label class="text-sm font-semibold text-slate-700 ml-1">Password</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400 material-symbols-outlined text-[20px]">lock</span>
<input class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-slate-400 hover:text-slate-600" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex justify-end pt-1">
<a class="text-xs font-medium text-primary hover:text-primary/80" href="#">Forgot Password?</a>
</div>
</div>
<!-- Primary Login Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98] mt-2 flex items-center justify-center gap-2" type="button">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-slate-200"></div>
<span class="flex-shrink-0 mx-4 text-slate-400 text-xs font-medium uppercase">Or login with</span>
<div class="flex-grow border-t border-slate-200"></div>
</div>
<!-- Face Login Button -->
<button class="w-full bg-white border-2 border-primary/10 hover:border-primary/30 hover:bg-slate-50 text-slate-700 font-semibold py-3.5 rounded-xl transition-all active:scale-[0.98] flex items-center justify-center gap-3 group" type="button">
<div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-primary text-[20px]">face</span>
</div>
<span>Face Login</span>
</button>
</form>
</div>
<!-- Footer -->
<div class="p-6 text-center">
<p class="text-slate-400 text-xs">
                By logging in, you agree to our <a class="text-slate-600 underline decoration-slate-300 underline-offset-2" href="#">Terms</a> &amp; <a class="text-slate-600 underline decoration-slate-300 underline-offset-2" href="#">Privacy Policy</a>
</p>
</div>
</div>
</body></html>
