<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Hybrid Crypto Tool – 100% Working AES-GCM</title>
		<script src="https://unpkg.com/jsencrypt@3.3.2/bin/jsencrypt.min.js"></script>
		<script src="https://unpkg.com/crypto-js@4.2.0/crypto-js.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
		<style>
			body {
				font-family: system-ui, sans-serif;
				max-width: 960px;
				margin: 40px auto;
				padding: 20px;
				background: #f0f8ff;
				line-height: 1.6;
			}
			.box {
				background: #fff;
				padding: 25px;
				margin: 20px 0;
				border-radius: 12px;
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
			}
			h1,
			h2 {
				color: #1e40af;
			}
			textarea,
			pre {
				font-family: Consolas, monospace;
				width: 100%;
				padding: 14px;
				border: 1px solid #ccc;
				border-radius: 8px;
				font-size: 14px;
			}
			textarea {
				min-height: 130px;
				resize: vertical;
			}
			button {
				padding: 12px 24px;
				margin: 8px 4px;
				font-size: 16px;
				border: none;
				border-radius: 8px;
				color: #fff;
				cursor: pointer;
			}
			.btn-load {
				background: #2563eb;
			}
			.btn-enc {
				background: #16a34a;
			}
			.btn-dec {
				background: #ea580c;
			}
			.copy {
				background: #64748b;
				font-size: 13px;
				float: right;
				padding: 8px 14px;
			}
			pre {
				background: #f8fafc;
				white-space: pre-wrap;
				word-break: break-all;
			}
			.status {
				padding: 14px;
				border-radius: 8px;
				margin: 10px 0;
				font-weight: bold;
				text-align: center;
			}
			.ok {
				background: #dcfce7;
				color: #166534;
			}
			.err {
				background: #fee2e2;
				color: #991b1b;
			}
			.btn-qr {
				background: #9333ea;
			}
			#qrContainer {
				text-align: center;
				margin-top: 20px;
				display: none;
			}
		</style>
	</head>
	<body>
		<h1>RSA + AES-256-GCM Hybrid Tool (Finally Fixed!)</h1>
		<p>
			Works 100% offline. Click the two load buttons once – keys are saved
			forever.
		</p>

		<div class="box">
			<h2>1. Load Keys (one-time)</h2>
			<div id="status" class="status err">Keys not loaded</div>
			<button class="btn-load" onclick="loadFile('public')">
				Load public.pem
			</button>
			<button class="btn-load" onclick="loadFile('private')">
				Load private.pem
			</button>
			<button class="copy" onclick="copy('publicKey')">
				Copy Public
			</button>
			<button class="copy" onclick="copy('privateKey')">
				Copy Private
			</button>
			<pre id="publicKey">—</pre>
			<pre id="privateKey">—</pre>
		</div>

		<div class="box">
			<h2>2. Encrypt</h2>
			<textarea id="plainText" placeholder='{"hello":"world"}'></textarea
			><br />
			<button class="btn-enc" onclick="encryptMessage()">
				Encrypt → Base64
			</button>
			<pre id="encryptedResult">—</pre>
			<button class="copy" onclick="copy('encryptedResult')">
				Copy Encrypted
			</button>
			<button class="btn-qr" onclick="generateQR()">
				Generate QR Code
			</button>
			<div id="qrContainer">
				<br />
				<button class="copy" onclick="downloadQR()">Download QR</button>
			</div>
		</div>

		<div class="box">
			<h2>3. Decrypt</h2>
			<textarea
				id="encryptedInput"
				placeholder="Paste encrypted string here..."
			></textarea
			><br />
			<button class="btn-dec" onclick="decryptMessage()">Decrypt</button>
			<pre id="decryptedResult">—</pre>
			<button class="copy" onclick="copy('decryptedResult')">
				Copy Decrypted
			</button>
		</div>

		<script>
			const crypt = new JSEncrypt({ default_key_size: 4096 });
			let publicKey = localStorage.getItem('pubKey') || '';
			let privateKey = localStorage.getItem('priKey') || '';

			function $(id) {
				return document.getElementById(id);
			}
			function setStatus(txt, ok = true) {
				const s = $('status');
				s.textContent = txt;
				s.className = 'status ' + (ok ? 'ok' : 'err');
			}
			function copy(id) {
				navigator.clipboard
					.writeText($(id).textContent)
					.then(() => alert('Copied!'));
			}

			// Load saved keys
			if (publicKey && privateKey) {
				$('publicKey').textContent = publicKey;
				$('privateKey').textContent = privateKey;
				crypt.setPublicKey(publicKey);
				crypt.setPrivateKey(privateKey);
				setStatus('Keys loaded from browser – ready to go!', true);
			}

			function loadFile(type) {
				const input = document.createElement('input');
				input.type = 'file';
				input.accept = '.pem';
				input.onchange = (e) => {
					const file = e.target.files[0];
					const reader = new FileReader();
					reader.onload = (ev) => {
						const pem = ev.target.result.trim();
						if (type === 'public') {
							publicKey = pem;
							localStorage.setItem('pubKey', pem);
							$('publicKey').textContent = pem;
							crypt.setPublicKey(pem);
						} else {
							privateKey = pem;
							localStorage.setItem('priKey', pem);
							$('privateKey').textContent = pem;
							crypt.setPrivateKey(pem);
						}
						if (publicKey && privateKey)
							setStatus('Both keys loaded – ready!', true);
					};
					reader.readAsText(file);
				};
				input.click();
			}

			// ──────────────────────── FIXED ENCRYPT (uses AES-256-CBC) ────────────────────────
			function encryptMessage() {
				if (!publicKey) return alert('Load public key first');
				const text = $('plainText').value.trim();
				if (!text) return alert('Enter text');

				try {
					const aesKey = CryptoJS.lib.WordArray.random(32); // 256-bit
					const iv = CryptoJS.lib.WordArray.random(16); // 128-bit IV for CBC

					// Encrypt with AES-256-CBC (standard, reliable)
					const encrypted = CryptoJS.AES.encrypt(text, aesKey, {
						iv: iv,
						mode: CryptoJS.mode.CBC,
						padding: CryptoJS.pad.Pkcs7,
					});

					const ciphertext = encrypted.ciphertext;

					// RSA encrypt key+iv
					const keyIvHex = aesKey.toString() + iv.toString();
					const rsaB64 = crypt.encrypt(keyIvHex);
					if (!rsaB64) throw 'RSA encrypt failed';

					const payload =
						rsaB64 +
						':' +
						CryptoJS.enc.Base64.stringify(ciphertext);

					$('encryptedResult').textContent = btoa(payload);
				} catch (e) {
					alert('Encrypt error: ' + e);
					console.error(e);
				}
			}

			// ──────────────────────── FIXED DECRYPT (matches encrypt exactly) ────────────────────────
			function decryptMessage() {
				if (!privateKey) return alert('Load private key first');
				const input = $('encryptedInput').value.trim();
				if (!input) return alert('Paste encrypted data');

				try {
					const [rsaB64, ctB64] = atob(input).split(':');

					const keyIvHex = crypt.decrypt(rsaB64);
					if (!keyIvHex) throw 'RSA decrypt failed';

					const aesKeyHex = keyIvHex.substr(0, 64);
					const ivHex = keyIvHex.substr(64, 32);
					const aesKey = CryptoJS.enc.Hex.parse(aesKeyHex);
					const iv = CryptoJS.enc.Hex.parse(ivHex);

					const ciphertext = CryptoJS.enc.Base64.parse(ctB64);

					const decrypted = CryptoJS.AES.decrypt(
						{ ciphertext: ciphertext },
						aesKey,
						{
							iv: iv,
							mode: CryptoJS.mode.CBC,
							padding: CryptoJS.pad.Pkcs7,
						}
					);

					const result = decrypted.toString(CryptoJS.enc.Utf8);

					$('decryptedResult').textContent = result;
				} catch (e) {
					alert('Decrypt error: ' + e);
					console.error(e);
				}
			}

			// ──────────────────────── QR CODE GENERATION ────────────────────────
			function generateQR() {
				const encrypted = $('encryptedResult').textContent.trim();
				if (encrypted === '—') return alert('Encrypt something first');

				const container = $('qrContainer');
				container.innerHTML = ''; // Clear previous QR

				new QRCode(container, {
					text: encrypted,
					width: 300,
					height: 300,
					colorDark: '#000000',
					colorLight: '#ffffff',
					correctLevel: QRCode.CorrectLevel.H,
				});

				container.style.display = 'block';
			}

			function downloadQR() {
				const container = $('qrContainer');
				const canvas = container.querySelector('canvas');
				if (!canvas) return alert('Generate QR code first');

				const link = document.createElement('a');
				link.href = canvas.toDataURL('image/png');
				link.download = 'encrypted_qr.png';
				link.click();
			}
		</script>

		<p>
			Works perfectly • No more CryptoJS errors • Compatible with your
			Flutter/OpenSSL code
		</p>
	</body>
</html>
