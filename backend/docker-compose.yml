version: "3.9"

services:
  # ─────────────────────────────────────────
  # PostgreSQL 16 database
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: vedura
      POSTGRES_PASSWORD: vedura_pass
      POSTGRES_DB: vedura_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vedura -d vedura_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # FastAPI application
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app          # Hot-reload: mount source code
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Override DATABASE_URL to use the Docker service name
      DATABASE_URL: postgresql+asyncpg://vedura:vedura_pass@db:5432/vedura_db

volumes:
  postgres_data:
  uploads:
