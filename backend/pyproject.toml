[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["."]
reportMissingImports = "none"
reportMissingModuleSource = "none"
typeCheckingMode = "basic"
